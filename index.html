<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosmos Construction - Website Under Update</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            background-color: #f8f9fa; 
            color: #333; 
            margin: 0;
        }
        .container { 
            max-width: 550px; 
            margin: 60px auto; 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 { 
            color: #1a365d; 
            font-size: 24px;
            margin-bottom: 15px;
        }
        p { 
            font-size: 16px; 
            line-height: 1.6; 
            color: #555;
        }
        .contact-box { 
            margin-top: 35px; 
            background: #f0f4f8; 
            padding: 20px; 
            border-radius: 8px; 
            border-left: 4px solid #1a365d;
            text-align: left;
        }
        .contact-title {
            font-weight: bold;
            color: #1a365d;
            margin-bottom: 10px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .contact-item {
            margin: 8px 0;
            font-size: 16px;
        }
        .contact-item a {
            color: #1a365d;
            text-decoration: none;
            font-weight: 600;
        }
        .contact-item a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Image: This displays automatically once you upload a file named logo.png -->
        <img src="logo.png" alt="Kosmos Construction Logo" class="logo" onerror="this.style.display='none';">
        
        <h1>Kosmos Construction</h1>
        <p>Our website is currently undergoing a planned update to bring you a better digital experience. We will be back online shortly.</p>
        
        <div class="contact-box">
            <div class="contact-title">Contact Us Directly</div>
            <div class="contact-item">📞 Phone: <a href="tel:01617063270">0161 706 3270</a></div>
            <div class="contact-item">📧 Email: <a href="mailto:info@kosmosconstruction.co.uk">info@kosmosconstruction.co.uk</a></div>
        </div>
    </div>

</body>
</html>
